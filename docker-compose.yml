services:
    webserver:
        build: docker/webserver

        expose:
            - 80
        ports:
            - ${APP_PORT:-80}:80
        volumes:
            - .:/app
        environment:
            RUNTIME_UID: ${WWW_DATA_UID:-33}
            RUNTIME_GID: ${WWW_DATA_GID:-33}
            APP_ENV: dev
            DATABASE_URL: 'mysql://user:userpass@db:3306/thedatabase?serverVersion=8.0'
            USER_PASSWORD: user
            ADMIN_PASSWORD: admin
    metrix:
        build: docker/metrix
        volumes:
            - ./metrix:/app
        environment:
            METRIX_PUBLIC: 'true'
    db:
        image: mysql:8.0.40
        expose:
            - 3306
        volumes:
            - .:/mnt
        working_dir: /mnt
        environment:
            MYSQL_ROOT_PASSWORD: rootpass
            MYSQL_DATABASE: thedatabase
            MYSQL_USER: user
            MYSQL_PASSWORD: userpass
    node:
        build:
            context: docker/node
            args:
                - WWW_DATA_UID=${WWW_DATA_UID:-orig}
                - WWW_DATA_GID=${WWW_DATA_GID:-orig}
        volumes:
            - .:/workspace
