security:
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        users_in_memory:
            memory:
                users:
                    user: { password: '$2y$13$mRz5neO5qTZ/lJLBdhtFUOCYjxs1na/c8nNkz4xqigUMNYuLPv5M.', roles: ['ROLE_USER'] }
                    admin: { password: '$2y$13$NFl1pxpyUmEwqPjyTNtm9us/1myNzZ6E1tJ6.hIGPYtpEneFEscLq', roles: ['ROLE_USER', 'ROLE_ADMIN'] }

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: users_in_memory

            form_login:
                login_path: app.login
                check_path: app.login
                username_parameter: "username"
                password_parameter: "password"
            logout:
                path: app.logout
                target: main

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be usead
    access_control:
         #- { path: ^/, roles: ROLE_USER }
